# docker-compose.yml
name: wikipedia-analysis

networks:
  wiki_net:
    driver: bridge

volumes:
  datos_broker:

x-worker-base: &worker-base
  build:
    context: .
  networks:
    - wiki_net
  volumes:
    - ./config:/app/config:ro
  depends_on:
    rabbitmq:
      condition: service_healthy #Esperamos a que rabbit se instancie healty antes se seguir
    inicializador:
      condition: service_completed_successfully
  stop_grace_period: 30s # tiempo que le damos al sistema antes de hacer sigkill para manejar un grace shutdown
  restart: on-failure

services:
  rabbitmq:
    image: rabbitmq:4.1-management
    networks:
      - wiki_net
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=wikipedia
      - RABBITMQ_DEFAULT_PASS=desarrollo
      - RABBITMQ_DEFAULT_VHOST=/wikipedia
    volumes:
      - datos_broker:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 12

  inicializador:
    build:
      context: .
      dockerfile: src/workers/date_router/Dockerfile
    entrypoint: ["python3", "-m", "src.middleware.inicializar", "config/config.json"]
    networks:
      - wiki_net
    volumes:
      - ./config:/app/config:ro
    environment:
      - WIKI_MW_BROKER_HOST=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"

  gateway:
    <<: *worker-base #Comando para evitar repetir codigo, basicamente trae todo el codigo que habia en worker base aca evitando volver a definir lo mismo
    build:
      context: .
      dockerfile: src/gateway/Dockerfile
    environment:
      - WIKI_MW_BROKER_HOST=rabbitmq
      - MIDDLEWARE_CONFIG=config/config.json
      # grupo de la topología desde el que se publican los artículos
      - GATEWAY_GROUP=gateway
      - GATEWAY_INSTANCE=0
      # grupo de la topología que recibe los resultados de los workers
      - GATEWAY_RESULTS_GROUP=gateway_resultados
      - GATEWAY_RESULTS_INSTANCE=0
      # segundos que se espera el ACK del cliente tras enviarle un ERROR
      - GATEWAY_ERROR_ACK_SECONDS=10
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5555
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 5555), 2).close()"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      replicas: 1

  client:
    build:
      context: .
      dockerfile: src/client/Dockerfile
    networks:
      - wiki_net
    volumes:
      - ./input:/app/input:ro
      - ./output:/app/output
    environment:
      # directorio con los .parquet a enviar (todos, en orden de nombre, como una sola ejecución)
      - INPUT_DIR=/app/input
      # los resultados se guardan en OUTPUT_DIR/client_<CLIENT_ID>, un archivo por consulta
      - OUTPUT_DIR=/app/output
      - CLIENT_ID=0
      # filas por lote
      - BATCH_SIZE=64
      # debe coincidir con limites.max_bytes_por_mensaje de config/config.json (lo usa el gateway)
      - MAX_FRAME_BYTES=350000
      - SERVER_HOST=gateway
      - SERVER_PORT=5555
      - CONNECT_TIMEOUT_SECONDS=10
      # timeout de lectura del socket: cada cuánto se revisa si hay que detenerse
      - SOCKET_TIMEOUT_SECONDS=1
      - LOG_LEVEL=INFO
    depends_on:
      gateway:
        condition: service_healthy
    stop_grace_period: 30s

  client_2:
    build:
      context: .
      dockerfile: src/client/Dockerfile
    networks:
      - wiki_net
    volumes:
      - ./input:/app/input:ro
      - ./output:/app/output
    environment:
      # directorio con los .parquet a enviar (todos, en orden de nombre, como una sola ejecución)
      - INPUT_DIR=/app/input/input_2
      # los resultados se guardan en OUTPUT_DIR/client_<CLIENT_ID>, un archivo por consulta
      - OUTPUT_DIR=/app/output
      - CLIENT_ID=1
      # filas por lote
      - BATCH_SIZE=32
      # debe coincidir con limites.max_bytes_por_mensaje de config/config.json (lo usa el gateway)
      - MAX_FRAME_BYTES=65536
      - SERVER_HOST=gateway
      - SERVER_PORT=5555
      - CONNECT_TIMEOUT_SECONDS=10
      # timeout de lectura del socket: cada cuánto se revisa si hay que detenerse
      - SOCKET_TIMEOUT_SECONDS=1
      - LOG_LEVEL=INFO
    depends_on:
      gateway:
        condition: service_healthy
    stop_grace_period: 30s

  date_router:
    <<: *worker-base
    build:
      context: .
      dockerfile: src/workers/date_router/Dockerfile
    environment:
      - WIKI_MW_BROKER_HOST=rabbitmq
      - WIKI_MW_PROCESO_GRUPO=date_router
      - WIKI_MW_PROCESO_INSTANCIA=0
    deploy:
      replicas: 1

  word_occurrences:
    <<: *worker-base
    build:
      context: .
      dockerfile: src/workers/word_occurrences/Dockerfile
    environment:
      - WIKI_MW_BROKER_HOST=rabbitmq
      - WIKI_MW_PROCESO_GRUPO=word_occurrences
      - WIKI_MW_PROCESO_INSTANCIA=0
    deploy:
      replicas: 1

  q1_filter_lang:
    <<: *worker-base
    build:
      context: .
      dockerfile: src/workers/q1/filter_lang/Dockerfile
    environment:
      - WIKI_MW_BROKER_HOST=rabbitmq
      - WIKI_MW_PROCESO_GRUPO=q1_filter_lang
      - WIKI_MW_PROCESO_INSTANCIA=0
    deploy:
      replicas: 1

  q1_formatter:
    <<: *worker-base
    build:
      context: .
      dockerfile: src/workers/q1/formatter/Dockerfile
    environment:
      - WIKI_MW_BROKER_HOST=rabbitmq
      - WIKI_MW_PROCESO_GRUPO=q1_formatter
      - WIKI_MW_PROCESO_INSTANCIA=0
    deploy:
      replicas: 1

  q2_filter_bio:
    <<: *worker-base
    build:
      context: .
      dockerfile: src/workers/q2/filter_bio/Dockerfile
    environment:
      - WIKI_MW_BROKER_HOST=rabbitmq
      - WIKI_MW_PROCESO_GRUPO=q2_filter_bio
      - WIKI_MW_PROCESO_INSTANCIA=0
    deploy:
      replicas: 1

  q2_image_downloader:
    <<: *worker-base
    build:
      context: .
      dockerfile: src/workers/q2/image_downloader/Dockerfile
    environment:
      - WIKI_MW_BROKER_HOST=rabbitmq
      - WIKI_MW_PROCESO_GRUPO=q2_image_downloader
      - WIKI_MW_PROCESO_INSTANCIA=0
    deploy:
      replicas: 1

  q3_intersection:
    <<: *worker-base
    build:
      context: .
      dockerfile: src/workers/q3/intersection/Dockerfile
    environment:
      - WIKI_MW_BROKER_HOST=rabbitmq
      - WIKI_MW_PROCESO_GRUPO=q3_intersection
      - WIKI_MW_PROCESO_INSTANCIA=0
    deploy:
      replicas: 1

  q4_frequency:
    <<: *worker-base
    build:
      context: .
      dockerfile: src/workers/q4/frequency/Dockerfile
    environment:
      - WIKI_MW_BROKER_HOST=rabbitmq
      - WIKI_MW_PROCESO_GRUPO=frecuencias
      - WIKI_MW_PROCESO_INSTANCIA=0
    deploy:
      replicas: 1

  q4_top_n:
    <<: *worker-base
    build:
      context: .
      dockerfile: src/workers/q4/top_n/Dockerfile
    command: ["--presupuesto-memoria-bytes", "16777216"]
    environment:
      - WIKI_MW_BROKER_HOST=rabbitmq
      - WIKI_MW_PROCESO_GRUPO=top_n
      - WIKI_MW_PROCESO_INSTANCIA=0
    deploy:
      replicas: 1

  q5_average:
    <<: *worker-base
    build:
      context: .
      dockerfile: src/workers/q5/average/Dockerfile
    environment:
      - WIKI_MW_BROKER_HOST=rabbitmq
      - WIKI_MW_PROCESO_GRUPO=q5_average
      - WIKI_MW_PROCESO_INSTANCIA=0
    deploy:
      replicas: 1

  q5_comparator:
    <<: *worker-base
    build:
      context: .
      dockerfile: src/workers/q5/comparator/Dockerfile
    volumes:
      - ./config:/app/config:ro
      - ./data/temp:/app/data/temp:rw
    environment:
      - WIKI_MW_BROKER_HOST=rabbitmq
      - WIKI_MW_PROCESO_GRUPO=q5_comparator
      - WIKI_MW_PROCESO_INSTANCIA=0
      - BATCH_SIZE_Q5=1000
    deploy:
      replicas: 1
