services:
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: prueba
      RABBITMQ_DEFAULT_PASS: prueba
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 12
    volumes:
      - datos_broker:/var/lib/rabbitmq

  escenarios:
    image: wikipedia-pruebas:local
    build:
      context: ..
      dockerfile: tests/Dockerfile
    command: ["python", "-m", "unittest", "discover", "-s", "${DIRECTORIO_PRUEBAS:-tests}", "-t", ".", "-p", "test_*.py", "-v"]
    init: true
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  datos_broker:
