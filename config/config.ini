; Configuración de comunicación del tramo Q4.
; El usuario y el virtual host deben existir en el broker.
[broker]
host = rabbitmq
puerto = 5672
usuario = wikipedia
contrasena = desarrollo
virtual_host = /wikipedia
latido_segundos = 60
timeout_conexion_segundos = 10
timeout_bloqueo_segundos = 30

; Cada contenedor sobrescribe su identidad mediante variables de entorno.
; Los índices de instancia comienzan en cero.
[proceso]
grupo = frecuencias
instancia = 0

[limites]
; Entregas sin ACK por instancia receptora, sumando reparto y afinidad.
mensajes_sin_confirmar = 4
; Mensajes listos para entregar en cada cola; excluye los ya entregados sin ACK.
max_mensajes_por_cola = 1000
max_bytes_por_mensaje = 65536
; Salidas preparadas por llamada: hasta 8 * 65536 bytes de cuerpos serializados.
max_envios_por_publicacion = 8

; Todos los procesos deben conocer las mismas cantidades y rutas.
[grupos]
ocurrencias = 2
frecuencias = 2
top_n = 1

[ruta:palabras]
origen = ocurrencias
destino = frecuencias
entrada = palabras

[ruta:conteos]
origen = frecuencias
destino = top_n
entrada = conteos
